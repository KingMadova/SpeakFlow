name: SpeakFlow quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

jobs:
  validate:
    name: TypeScript, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Install Playwright for browser smoke test
        run: npm install --no-save --legacy-peer-deps @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: bun run build

      - name: Start production preview
        run: |
          bun run preview -- --host 127.0.0.1 > /tmp/speakflow-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/speakflow-preview.log
          exit 1

      - name: Run browser smoke test
        run: npx playwright test tests/browser-smoke.spec.cjs --reporter=line
