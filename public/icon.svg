<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A24" />
      <stop offset="100%" stop-color="#FF6200" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#101014" />
    </radialGradient>
  </defs>
  <!-- Background with dark circle -->
  <rect width="512" height="512" rx="128" fill="#101014"/>
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)"/>

  <!-- Soundwave bars inside 80% safe zone -->
  <g transform="translate(256, 256)">
    <!-- Bar 1 -->
    <rect x="-140" y="-55" width="28" height="110" rx="14" fill="url(#grad)" opacity="0.85" />
    <!-- Bar 2 -->
    <rect x="-80" y="-95" width="28" height="190" rx="14" fill="url(#grad)" opacity="0.95" />
    <!-- Bar 3 (center) -->
    <rect x="-14" y="-140" width="28" height="280" rx="14" fill="url(#grad)" />
    <!-- Bar 4 -->
    <rect x="52" y="-105" width="28" height="210" rx="14" fill="url(#grad)" opacity="0.95" />
    <!-- Bar 5 -->
    <rect x="112" y="-50" width="28" height="100" rx="14" fill="url(#grad)" opacity="0.85" />
  </g>
</svg>
